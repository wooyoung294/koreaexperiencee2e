[project]
name = "koreaexperiencee2e"
version = "0.1.0"
description = "KoreaExperience web E2E tests"
requires-python = ">=3.11"
dependencies = [
    "allure-pytest>=2.13,<3",
    "playwright>=1.50,<2",
    "pytest>=8,<9",
    "pytest-base-url>=2.1,<3",
    "pytest-bdd>=8,<9",
    "pytest-playwright>=0.6,<1",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "UP", "W"]
