[pytest]
addopts = -ra --strict-markers --alluredir=allure-results --clean-alluredir -p no:cacheprovider
testpaths = case
python_files = test_*.py
python_functions = test_*
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
markers =
    login: 실제 로그인 자격증명이 필요한 민감정보 보호 시나리오
    popup: 팝업 테스트를 위해 오늘 안 보기 Local Storage 값을 제거
    smoke: 핵심 기능 스모크 테스트
    regression: 전체 회귀 테스트
filterwarnings =
    ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin\.gherkin_line
